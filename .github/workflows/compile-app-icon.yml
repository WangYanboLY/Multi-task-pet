name: Compile macOS app icon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/compile-app-icon.yml
      - native/GenerateIcon.swift
      - native/AppIconContents.json
      - native/validate_asset_catalog.py
      - native/build.sh

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate icon images
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework AppKit native/GenerateIcon.swift -o "$RUNNER_TEMP/GenerateIcon"
          for palette in main gpt claude; do
            CATALOG="$RUNNER_TEMP/$palette/Assets.xcassets"
            mkdir -p "$CATALOG/AppIcon.appiconset"
            "$RUNNER_TEMP/GenerateIcon" "$CATALOG/AppIcon.appiconset" "$palette"
            cp native/AppIconContents.json "$CATALOG/AppIcon.appiconset/Contents.json"
            python3 -m json.tool "$CATALOG/AppIcon.appiconset/Contents.json" >/dev/null
          done
      - name: Compile and inspect asset catalog
        shell: bash
        run: |
          set -euo pipefail
          for palette in main gpt claude; do
            OUTPUT="$RUNNER_TEMP/$palette/compiled"
            mkdir -p "$OUTPUT"
            xcrun actool "$RUNNER_TEMP/$palette/Assets.xcassets" \
              --compile "$OUTPUT" \
              --platform macosx \
              --minimum-deployment-target 13.0 \
              --target-device mac \
              --app-icon AppIcon \
              --output-partial-info-plist "$OUTPUT/assetcatalog_generated_info.plist" \
              --output-format human-readable-text \
              --errors --warnings
            python3 native/validate_asset_catalog.py "$OUTPUT/Assets.car"
          done
      - name: Upload main icon
        uses: actions/upload-artifact@v4
        with:
          name: agent-pet-assets-car
          path: ${{ runner.temp }}/main/compiled/Assets.car
          if-no-files-found: error
      - name: Upload GPT notification icon
        uses: actions/upload-artifact@v4
        with:
          name: agent-pet-gpt-assets-car
          path: ${{ runner.temp }}/gpt/compiled/Assets.car
          if-no-files-found: error
      - name: Upload Claude notification icon
        uses: actions/upload-artifact@v4
        with:
          name: agent-pet-claude-assets-car
          path: ${{ runner.temp }}/claude/compiled/Assets.car
          if-no-files-found: error
